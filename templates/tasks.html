{% extends 'base.html' %}{% block content %}<h2>Tasks & Follow-ups</h2><div class="card p-3"><table class="table"><tr><th>Task</th><th>Priority</th><th>Due</th><th>Status</th><th></th></tr>{% for t in tasks %}<tr><td>{{t.title}}<br><small>{{t.description|truncate(120)}}</small></td><td>{{t.priority}}</td><td>{{t.due_date or '-'}}</td><td>{{t.status}}</td><td>{% if t.status!='DONE' %}<form method="post" action="{{url_for('done',id=t.id)}}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-success">Done</button></form>{% endif %}</td></tr>{% endfor %}</table></div>{% endblock %}
