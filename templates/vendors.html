{% extends 'base.html' %}{% block content %}<h2>Vendors</h2><div class="card p-3 mb-3"><form method="post" action="{{url_for('add_vendor')}}" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-3"><input class="form-control" name="name" placeholder="Name" required></div><div class="col-md-3"><input class="form-control" name="email" placeholder="Email"></div><div class="col-md-2"><input class="form-control" name="domain" placeholder="Domain"></div><div class="col-md-2"><input class="form-control" name="phone" placeholder="Phone"></div><div class="col-md-2"><button class="btn btn-primary w-100">Add</button></div></form></div><div class="card p-3"><table class="table"><tr><th>Name</th><th>Email</th><th>Domain</th><th>Phone</th></tr>{% for v in vendors %}<tr><td>{{v.name}}</td><td>{{v.email}}</td><td>{{v.domain}}</td><td>{{v.phone}}</td></tr>{% endfor %}</table></div>{% endblock %}
