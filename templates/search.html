{% extends 'base.html' %}{% block content %}<h2>Search</h2><form class="mb-3"><div class="input-group"><input class="form-control" name="q" value="{{q}}" placeholder="sender, subject or body"><button class="btn btn-primary">Search</button></div></form><div class="card p-3"><table class="table"><tr><th>Sender</th><th>Subject</th><th>Category</th><th>Priority</th></tr>{% for e in emails %}<tr data-href="{{url_for('email_view',id=e.id)}}" style="cursor:pointer"><td>{{e.sender}}</td><td>{{e.subject}}</td><td>{{e.category}}</td><td>{{e.priority}}</td></tr>{% endfor %}</table></div>{% endblock %}
